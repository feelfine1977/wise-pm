name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  # Runtime checks are offline. Dependency installation is a separate setup step.
  WISE_OLLAMA_LIVE: "0"
  WISE_OLLAMA_MODEL: ""
  WISE_BPIC19_CSV: ""
  WISE_OCEL2_JSON: ""
  WISE_OCEL2_SQLITE: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", deps: "numpy==1.24.* pandas==2.0.*", experimental: false }
          - { os: ubuntu-latest, python: "3.12", deps: "", experimental: false }
          - { os: ubuntu-latest, python: "3.13", deps: "", experimental: false }
          - { os: ubuntu-latest, python: "3.13", deps: "--pre --upgrade numpy pandas", experimental: true }
          - { os: macos-latest, python: "3.12", deps: "", experimental: false }
          - { os: windows-latest, python: "3.12", deps: "", experimental: false }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,stats]"
      - if: matrix.deps != ''
        run: python -m pip install ${{ matrix.deps }}
      - name: Require immutable parity reference
        run: |
          git cat-file -e df5db50b839cc124b489a269894f5a2bfe7dc634:src/wise/prioritization.py
          python -c "import hashlib, pathlib; p = pathlib.Path('tests/extensions/test_baseline_contract.py'); assert hashlib.sha256(p.read_bytes()).hexdigest() == 'a47445b232fe3b3626e7bf8c788a918dfd813aba4d978164060f1b1a975dda5b'"
      - name: Offline suite, including contract and parity checks
        run: python -m pytest -ra --cov=wise --cov-report=term-missing
      - name: Recorded assistance scenarios (no live provider)
        run: python -c "from wise.evaluation.llm import load_tasks, run_tasks; r = run_tasks(load_tasks('tests/fixtures/llm_tasks'), env={}); print(r.render()); assert r.ok; assert len(r.outcomes) == 10 and len(r.skipped()) == 1"
      - run: python examples/quickstart.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . "ruff==0.12.0" "mypy==1.17.1" pandas-stubs
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python -m pip install dist/*.whl
      - run: python -c "import wise, pathlib; from importlib.metadata import version; assert pathlib.Path(wise.__file__).with_name('py.typed').exists(); assert version('wise-pm') == wise.__version__; assert '.dev' in wise.__version__; print(wise.__version__)"
      - run: wise validate examples/bpic19_norm.json
