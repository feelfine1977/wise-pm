name: CI

on:
  pull_request:
  push:
    branches: [main, next]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  # The uv version that produced uv.lock; bump it deliberately together with the lockfile.
  UV_VERSION: "0.7.16"

jobs:
  lint:
    name: lint, types, layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          # The release workflow calls this gate with a tag ref; keep those jobs cache-free.
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          python-version: "3.13"   # the type-check interpreter; pandas-stubs differ per Python fork of the lockfile
      - name: workflow security audit
        run: uvx zizmor==1.30.1 --min-severity medium .github/workflows
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
      - run: uv run --frozen mypy
      - run: uv run --frozen lint-imports

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.deps }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        deps: [locked]
        include:
          # Floor pins from pyproject (numpy 1.24 / pandas 2.0) on the oldest interpreter.
          - { os: ubuntu-latest, python: "3.10", deps: floor }
          - { os: macos-latest, python: "3.12", deps: locked }
          - { os: windows-latest, python: "3.12", deps: locked }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          # The release workflow calls this gate with a tag ref; keep those jobs cache-free.
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-packages --group dev
      - if: matrix.deps == 'floor'
        run: uv pip install "numpy==1.24.*" "pandas==2.0.*"
      - run: uv run --frozen --no-sync python -c "import sys, numpy, pandas, wise; print(sys.version); print('numpy', numpy.__version__, 'pandas', pandas.__version__, 'wise', wise.__version__)"
      # The golden tier resolves its mode from the manifest's environment block: exact on the record host, within
      # 1e-9 elsewhere. CI runners are never the record host (docs/semantics/parity.md).
      - run: uv run --frozen --no-sync pytest -m "not bench and not bpic19" --cov --cov-branch --cov-report=xml --cov-report=term-missing:skip-covered --junitxml=junit.xml
        env:
          WISE_GOLDEN_MODE: auto
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.deps == 'locked'
        name: golden determinism on this runner and drift against the committed record
        run: uv run --frozen --no-sync python packages/wise-pm/scripts/make_golden.py --check --mode report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.deps }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore

  build:
    name: build and smoke (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          # The release workflow calls this gate with a tag ref; keep those jobs cache-free.
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          python-version: "3.12"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv build --all-packages
      - run: uv run --frozen --no-sync twine check --strict dist/*
      - name: install the wheel into a clean environment and exercise it
        run: |
          uv venv smoke --python 3.12
          if [ -x smoke/bin/python ]; then SMOKE=smoke/bin/python; else SMOKE=smoke/Scripts/python.exe; fi
          uv pip install --python "$SMOKE" dist/wise_pm-*.whl
          "$SMOKE" -c "import pathlib, wise; assert pathlib.Path(wise.__file__).with_name('py.typed').exists(); print(wise.__version__)"
          "$SMOKE" -m wise.cli validate packages/wise-pm/examples/bpic19_norm.json
          "$SMOKE" -m wise.cli validate packages/wise-pm/examples/running_p2p_norm.json
          "$SMOKE" packages/wise-pm/examples/quickstart.py
      - name: install the sdist and run the packaged tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv venv sdist-check --python 3.12
          uv pip install --python sdist-check/bin/python dist/wise_pm-*.tar.gz pytest hypothesis pyarrow scipy
          tar -xzf dist/wise_pm-*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/wise_pm-*/
          "$GITHUB_WORKSPACE"/sdist-check/bin/python -m pytest -q -p no:cacheprovider --strict-markers -W error -m "not bench and not bpic19" tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: dist
          path: dist/
