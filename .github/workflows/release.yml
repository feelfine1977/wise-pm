# Release on a tag v<version>: verify that tag, package versions, CITATION.cff and
# CHANGELOG agree, build every distribution of the workspace (wise-pm today), publish
# through PyPI trusted publishing, then create the GitHub release from the CHANGELOG section.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.7.16"

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          python-version: "3.12"
      - run: uv lock --check
      - id: check
        run: uv run --frozen --no-sync python scripts/check_release.py "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run --frozen --no-sync pytest -m "not bench and not bpic19" -q

  gate:
    # The full CI gate (lint, matrix, build and smoke) for the exact release SHA.
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv build --all-packages
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run --frozen --no-sync twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - run: python3 scripts/changelog_section.py "${{ needs.verify.outputs.version }}" > release-notes.md
      - run: gh release create "${GITHUB_REF_NAME}" dist/* --title "wise-pm ${{ needs.verify.outputs.version }}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
